name: CI

# Enforce the green test suite automatically. Runs the same clean-room sequence
# a stranger would: exact install from the lockfile, strict typecheck, full tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.x'] # both active Node LTS lines
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` installs exactly from package-lock.json (fails if it drifts).
      # better-sqlite3 pulls a prebuilt binary here, so no compiler is needed.
      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Typecheck (strict)
        run: npx tsc --noEmit

      - name: Test
        run: npm run test
